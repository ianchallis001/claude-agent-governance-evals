[project]
name = "claude-agent-governance-evals"
version = "0.1.0"
description = "A regulator-grounded evaluation harness and governance classifier for Claude tool-use agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ian Challis" }]
keywords = ["claude", "anthropic", "llm-evals", "ai-governance", "mcp", "llm-as-judge"]

dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2.0.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cage = "cage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cage"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
