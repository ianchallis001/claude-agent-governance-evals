# Publish the package to PyPI via Trusted Publishing (OIDC) - no API token.
#
# One-time setup, done once on PyPI by the maintainer (the F-publish stop-line):
#   PyPI -> the project -> Publishing -> add a "Trusted Publisher" with
#     Owner:        ianchallis001
#     Repository:   claude-agent-governance-evals
#     Workflow:     release.yml
#     Environment:  pypi
# and create a GitHub Environment named "pypi" on this repo.
#
# Then a release is a single switch: publish a GitHub Release (tag v0.2.0),
# or run this workflow by hand (workflow_dispatch). The build job always runs
# and validates the artefacts; the publish job runs only for a Release.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata and long-description rendering
        # twine check confirms the README renders on PyPI - which is also what
        # carries the `mcp-name:` ownership string the MCP Registry verifies.
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    # Only publish from a real Release, never from a manual build-check run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-agent-governance-evals
    permissions:
      id-token: write  # mint the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
